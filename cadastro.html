<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Xêro Burguer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Xêro Burguer</a>
    <nav>
      <a href="index.html">Cardápio</a>
      <a href="sobre.html">Sobre nós</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main class="cadastro">
    <h1>Cadastre-se</h1>
    <p>Faça seu cadastro e peça seu xêro burguer!</p>

    <form action="#" method="post">

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="telefone">Telefone (WhatsApp)</label>
      <input type="tel" id="telefone" name="telefone"
             placeholder="83999999999" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="endereco">Endereço para entrega</label>
      <input type="text" id="endereco" name="endereco"
             placeholder="Rua, número e bairro" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit">Cadastrar</button>
    </form>

    <p>Já possui conta? <a href="login.html">Faça login</a></p>
  </main>

  <footer>
    <p>&copy; 2026 Xêro Burguer</p>
  </footer>

</body>
</html>
